  # -- detection beta: the defect the probe surfaced, shipped as itself -------------------
  # This ROI is the printed molecular-weight label column in the right-hand margin past the
  # blot, not a sample lane: its five "bands" sit at the five printed MW labels. Detection
  # locates printed type and quantifies it, and QC has nothing to say about it, because every
  # flag in the vocabulary qualifies a measurement and printed type measured cleanly is a
  # clean measurement of printed type. The verdict is `pass` and it is correct about the
  # flags and silent about what was measured.
  #
  # The ruling ships it for exactly that reason — "the fourth is the detection defect the
  # probe surfaced, shipped as itself rather than suppressed" — and the card says so on its
  # face. No parameter moves to suppress it: a minimum band width or a margin exclusion
  # introduced here would be a parameter chosen against a real crop that looked wrong
  # (Gate 1 ruling 3).
  - id: pmc12895598-fig3a-l5
    image: data/real/crops/PMC12895598_Fig3__A-EMT-GAPDH.png
    polarity: dark_on_bright
    config: default
    lane_roi: "180,0,30,201"
    title: "PMC12895598 · Fig. 3A · lane L5 · printed MW label column, not a sample lane"

  # -- pass: a genuine sample lane, both bands plainly visible ----------------------------
  # Its third ratio comes from a one-pixel-wide detection and is shown like the other two.
  # The card names it, derived from bands[0].roi in the document rather than from this file.
  - id: pmc13135410-fig4c-l8
