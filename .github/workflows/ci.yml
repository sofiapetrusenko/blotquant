name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest jsonschema

      - name: Lint
        run: ruff check .

      - name: Validate ground truth against schema
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path

          schema_path = Path("schema/ground_truth.schema.json")
          gt_dir = Path("data/ground_truth")

          # Phase 0 is merged: the schema and the gold set must both be present.
          # A missing schema or an empty gold set is a failure, not a skip.
          if not schema_path.exists():
              sys.exit(f"FAIL: {schema_path} is missing")

          from jsonschema import Draft202012Validator
          schema = json.loads(schema_path.read_text())
          validator = Draft202012Validator(schema)

          gt_files = sorted(gt_dir.glob("*.json")) if gt_dir.exists() else []
          if not gt_files:
              sys.exit(f"FAIL: no ground-truth files in {gt_dir}; "
                       f"regenerate with 'python -m synth --seed 42 --out data/'")

          failed = False
          for f in gt_files:
              errors = list(validator.iter_errors(json.loads(f.read_text())))
              if errors:
                  failed = True
                  print(f"FAIL {f}")
                  for e in errors:
                      print(f"  - {'/'.join(map(str, e.path)) or '<root>'}: {e.message}")
              else:
                  print(f"OK   {f}")
          sys.exit(1 if failed else 0)
          EOF

      - name: Tests
        run: pytest
